sentence=AVR hardware abstraction layer for ogr-node-core (OpenGardenRack node/I2C-slave library).
paragraph=Implements the I2C-slave transport, EN_IN/EN_OUT GPIO, and EEPROM-backed PLANT_UID storage for ATmega328-class (hardware TWI) targets, on top of Arduino's Wire and EEPROM libraries. ATtiny85-class (USI) support is planned. Requires ogr-node-core to be installed alongside it.
